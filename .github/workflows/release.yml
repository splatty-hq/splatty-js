name: Release

on:
  push:
    branches:
      - master

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Release Please
        uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/checkout@v5
        if: ${{ steps.release.outputs.release_created }}
        with:
          fetch-tags: true

      - uses: actions/setup-node@v4
        if: ${{ steps.release.outputs.release_created }}
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci
        if: ${{ steps.release.outputs.release_created }}

      - run: npm run build
        if: ${{ steps.release.outputs.release_created }}

      # Publishes with npm trusted publishing (OIDC) — no NPM_TOKEN needed.
      - run: npm publish
        if: ${{ steps.release.outputs.release_created }}
